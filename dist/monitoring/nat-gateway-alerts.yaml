apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kube-ovn-nat-gateway-alerts
  namespace: monitoring
  labels:
    role: alert-rules
    app.kubernetes.io/name: kube-ovn
spec:
  groups:
    - name: kube-ovn-nat-gw-ha.rules
      rules:
        # P0 致命告警：网关所有 Member 离线，无可用出网下一跳
        - alert: NatGwAllMembersDown
          expr: kube_ovn_nat_gw_ready_members == 0
          for: 10s
          labels:
            severity: disaster
            tier: network
          annotations:
            summary: "VPC NAT Gateway {{ $labels.gateway }} (VPC: {{ $labels.vpc }}) 所有 Member Pod 已全部离线！"
            description: "网关双活或单活实例已无任何就绪的 Pod，VPC 出网策略路由已自动降级为 Drop，出网流量发生完全中断。"
            runbook_url: "http://las-wiki.qiniu.io/SOP/Network/KubeOVN-NatGw-Failover/"

        # P1 告警：双活网关单点运行，容灾冗余丧失
        - alert: NatGwMemberDegraded
          expr: kube_ovn_nat_gw_ready_members < 2
          for: 1m
          labels:
            severity: warning
            tier: network
          annotations:
            summary: "VPC NAT Gateway {{ $labels.gateway }} (VPC: {{ $labels.vpc }}) 处于降级运行状态，仅剩单节点存活！"
            description: "网关就绪 Member 数少于 2，当前处于单点运行，若存活节点再次突发异常将导致全网中断，请尽快排查故障 Member Pod 状态。"
            runbook_url: "http://las-wiki.qiniu.io/SOP/Network/KubeOVN-NatGw-Failover/"

        # P0 告警：策略路由网关下一跳动态反解失败
        - alert: PolicyRouteResolveError
          expr: rate(kube_ovn_policy_route_resolve_errors_total[2m]) > 0
          for: 30s
          labels:
            severity: critical
            tier: network
          annotations:
            summary: "VPC {{ $labels.vpc }} 下网关 {{ $labels.gateway }} 的策略路由下一跳解析失败！"
            description: "控制器未能成功反解网关的动态 LAN IP，导致出向路由降级为 Drop，需检查网关 CR 与 Pod 状态。"

        # P0 告警：BFD 毫秒级探测会话掉线
        - alert: BfdSessionDown
          expr: kube_ovn_speaker_bfd_peer_up == 0
          for: 5s
          labels:
            severity: critical
            tier: network
          annotations:
            summary: "节点 {{ $labels.node }} 到网关 Peer {{ $labels.peer }} 的 BFD 会话跌死！"
            description: "BFD 硬件/毫秒心跳会话断开，OVN 策略路由已触发倒换接管。"

        # P0 告警：BGP Anycast /32 路由邻居失联
        - alert: BgpPeerDown
          expr: kube_ovn_speaker_bgp_peer_up == 0
          for: 10s
          labels:
            severity: critical
            tier: network
          annotations:
            summary: "节点 {{ $labels.node }} 到上联交换机 Peer {{ $labels.peer }} 的 BGP 邻居中断！"
            description: "BGP 邻居失联，Anycast /32 EIP 路由无法对外宣告，将导致外部回包路由黑洞。"
